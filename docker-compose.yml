version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reuse
      POSTGRES_PASSWORD: reuse
      POSTGRES_DB: reuse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reuse_test
      POSTGRES_PASSWORD: reuse_test
      POSTGRES_DB: reuse_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reuse_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
